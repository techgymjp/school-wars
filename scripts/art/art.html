<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap">
<body style="margin:0;background:#333">
<canvas id="c"></canvas>
<script>
// アイコンと起動画面の元画像を描く
function R(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function bg(ctx,S){ctx.fillStyle='#0f1016';ctx.fillRect(0,0,S,S);
  // 夜の廊下の床
  const g=ctx.createLinearGradient(0,S*0.55,0,S);g.addColorStop(0,'#3a2716');g.addColorStop(1,'#1c130b');ctx.fillStyle=g;ctx.fillRect(0,S*0.72,S,S*0.28);}
// 割れた窓（中心 cx,cy 幅 w）
function windowArt(ctx,cx,cy,w,seed){
  const h=w*0.9,x=cx-w/2,y=cy-h/2,f=w*0.06,r=R(seed);
  ctx.fillStyle='#7a4f2c';ctx.fillRect(x-f,y-f,w+2*f,h+2*f);
  ctx.fillStyle='#9a6a3f';ctx.fillRect(x-f,y-f,w+2*f,f*0.5);
  ctx.fillStyle='#2c3241';ctx.fillRect(x,y,w,h);
  // 残ったガラス片（ひびの入った放射状の破片）
  const ix=x+w*0.56,iy=y+h*0.46;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  const n=11;const ang=[];for(let i=0;i<n;i++)ang.push(i/n*Math.PI*2+r()*0.35);
  for(let i=0;i<n;i++){const a0=ang[i],a1=ang[(i+1)%n]+(i===n-1?Math.PI*2:0);
    if(r()<0.38)continue;const r0=w*(0.16+r()*0.12),R1=w*1.2;
    ctx.beginPath();ctx.moveTo(ix+Math.cos(a0)*r0,iy+Math.sin(a0)*r0);ctx.lineTo(ix+Math.cos(a0)*R1,iy+Math.sin(a0)*R1);ctx.lineTo(ix+Math.cos(a1)*R1,iy+Math.sin(a1)*R1);ctx.lineTo(ix+Math.cos(a1)*(r0*(0.8+r()*0.5)),iy+Math.sin(a1)*(r0*(0.8+r()*0.5)));ctx.closePath();
    ctx.fillStyle='rgba(170,220,235,0.78)';ctx.fill();ctx.strokeStyle='#ffffff';ctx.lineWidth=w*0.008;ctx.stroke();}
  ctx.restore();
  ctx.fillStyle='#7a4f2c';ctx.fillRect(cx-f*0.4,y,f*0.8,h);
  // 飛び散る破片
  for(let i=0;i<14;i++){const a=r()*Math.PI*2,d=w*(0.55+r()*0.35),s=w*(0.02+r()*0.03);const px=ix+Math.cos(a)*d,py=iy+Math.sin(a)*d*0.8;
    ctx.save();ctx.translate(px,py);ctx.rotate(r()*6);ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*0.7,s*0.6);ctx.lineTo(-s*0.6,s*0.4);ctx.closePath();ctx.fillStyle='#c8eefa';ctx.fill();ctx.restore();}
}
function bokken(ctx,x1,y1,x2,y2,w){ // 木刀
  ctx.lineCap='round';ctx.strokeStyle='#000';ctx.lineWidth=w*1.5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.strokeStyle='#c79f63';ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const k=0.26;ctx.strokeStyle='#3a2615';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1+(x2-x1)*k,y1+(y2-y1)*k);ctx.stroke();
  ctx.strokeStyle='#e0333d';ctx.lineWidth=w*1.6;ctx.lineCap='butt';const t=k+0.02;ctx.beginPath();ctx.moveTo(x1+(x2-x1)*k,y1+(y2-y1)*k);ctx.lineTo(x1+(x2-x1)*t,y1+(y2-y1)*t);ctx.stroke();
}
window.draw=(kind)=>{
  const c=document.getElementById('c'),ctx=c.getContext('2d');
  if(kind==='icon-only'||kind==='icon-foreground'||kind==='icon-background'){
    const S=1024;c.width=c.height=S;ctx.clearRect(0,0,S,S);
    if(kind!=='icon-foreground')bg(ctx,S);
    if(kind==='icon-background')return;
    // 前景は Android 側で 16.7% ずつ内側に縮めて置かれるので、ほぼいっぱいに描く
    const k=kind==='icon-foreground'?0.95:0.82;
    ctx.save();ctx.translate(S/2,S/2);ctx.scale(k,k);ctx.translate(-S/2,-S/2);
    windowArt(ctx,S*0.5,S*0.48,S*0.7,7);
    bokken(ctx,S*0.16,S*0.9,S*0.86,S*0.14,S*0.05);
    ctx.restore();return;}
  // 起動画面
  const S=2732;c.width=c.height=S;bg(ctx,S);
  windowArt(ctx,S*0.5,S*0.42,S*0.34,7);
  bokken(ctx,S*0.33,S*0.62,S*0.68,S*0.24,S*0.024);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`${S*0.075}px "Dela Gothic One"`;
  ctx.fillStyle='#e0333d';ctx.fillText('廊下爆走伝',S*0.5+S*0.006,S*0.7+S*0.006);
  ctx.fillStyle='#f1eadb';ctx.fillText('廊下爆走伝',S*0.5,S*0.7);
};
</script>
