name: iOS release (TestFlight)

# 本番の広告設定で iOS 版をビルドし、App Store Connect（TestFlight）にアップロードする。
# 審査への提出は App Store Connect で手で行う（docs/IOS_BUILD.md）。
# 必要な Secrets：IOS_DIST_CERT_P12_BASE64 / IOS_DIST_CERT_PASSWORD / ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64
# このリポジトリは非公開なので、Mac の実行時間は無料枠を 10 倍の速さで使う。
# そのため、ゲームか iOS の設定を変えたときだけ動かす（手動でも実行できる）
on:
  push:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-release.yml'
  workflow_dispatch:

# アップロードは途中で止めない（同じビルド番号が中途半端に残らないように）
concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUNDLE_ID: jp.techgym.schoolwars
      TEAM_ID: GNM3VTX9YG
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      # ios:release と同じ（本番の広告 ID でゲームのファイルを iOS のプロジェクトへコピー）
      - name: Copy web assets into the iOS project (production ads)
        run: npm run ios:release

      # ビルド番号は「100 + この Actions の実行回数」。Mac から手でアップロードした番号（1, 2, …）と重ならないようにする。
      # バージョン（ストアに表示される番号）は package.json の version
      - name: Decide version and build number
        run: |
          echo "BUILD_NUMBER=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Import the distribution certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KC"

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          # fastlane 用（同じ鍵を JSON にしたもの）
          python3 - <<'EOF'
          import json, os
          d = os.environ['RUNNER_TEMP'] + '/asc'
          key = open(f"{d}/AuthKey_{os.environ['ASC_KEY_ID']}.p8").read()
          json.dump({'key_id': os.environ['ASC_KEY_ID'], 'issuer_id': os.environ['ASC_ISSUER_ID'], 'key': key, 'in_house': False}, open(f'{d}/api_key.json', 'w'))
          EOF

      # App Store 配布用のプロビジョニングプロファイルを、Apple のサイトで作成（なければ）してダウンロードする
      - name: Get the App Store provisioning profile
        run: |
          command -v fastlane > /dev/null || brew install fastlane
          fastlane run get_provisioning_profile \
            app_identifier:"$BUNDLE_ID" team_id:"$TEAM_ID" \
            api_key_path:"$RUNNER_TEMP/asc/api_key.json" \
            output_path:"$RUNNER_TEMP" filename:"appstore.mobileprovision"
          PROFILE="$RUNNER_TEMP/appstore.mobileprovision"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Profile: $NAME ($UUID)"

      # Xcode の設定は「自動で署名」（手元の Mac 用）。ここでは App ターゲットの Release だけを、
      # さっきの証明書とプロファイルで署名する設定に書き換える（リポジトリには反映しない）
      - name: Switch the App target to manual signing (CI only)
        run: |
          python3 - <<'EOF'
          import os, re
          p = 'ios/App/App.xcodeproj/project.pbxproj'
          s = open(p).read()
          m = re.search(r'/\* Release \*/ = \{\s*isa = XCBuildConfiguration;\s*buildSettings = \{[^}]*?PRODUCT_BUNDLE_IDENTIFIER = jp\.techgym\.schoolwars;', s)
          assert m, 'App の Release 設定が見つからない'
          block = m.group(0)
          new = block.replace('CODE_SIGN_STYLE = Automatic;',
              'CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n'
              '\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n'
              '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "%s";' % os.environ['PROFILE_NAME'])
          assert new != block
          open(p, 'w').write(s.replace(block, new))
          EOF

      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="$APP_VERSION" \
            archive | tail -60

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### バージョン $APP_VERSION（ビルド $BUILD_NUMBER）を App Store Connect にアップロードしました" >> "$GITHUB_STEP_SUMMARY"
          echo "10〜30 分ほどで TestFlight に表示されます。" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP/profile.plist"
